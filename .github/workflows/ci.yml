name: CI

# Validation only. Releases are manual: npm run release <patch|minor|major>.

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci -w packages/core -w packages/cero -w packages/tools --include-workspace-root --ignore-scripts
      - run: npm run lint

  test:
    strategy:
      fail-fast: false
      matrix:
        runtime: [bare, node]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci -w packages/core -w packages/cero -w packages/tools --include-workspace-root --ignore-scripts
      - run: npm rebuild bare
        if: matrix.runtime == 'bare'
      - run: npm test
        if: matrix.runtime == 'bare'
      - run: npm run test:node
        if: matrix.runtime == 'node'

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # packs the packages, installs the tarballs into an empty project and imports each one
      - run: npm run smoke

  types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci -w packages/core -w packages/cero -w packages/tools --include-workspace-root --ignore-scripts
      - run: npm run build:types --workspaces --if-present
      - run: git diff --exit-code -- packages/*/types
